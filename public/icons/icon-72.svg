<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14523E"/>
      <stop offset="60%" stop-color="#0E3B2E"/>
      <stop offset="100%" stop-color="#082720"/>
    </linearGradient>
    <linearGradient id="apple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E23B3B"/>
      <stop offset="100%" stop-color="#A81A1A"/>
    </linearGradient>
    <!-- Soft inner shadow used to "press" the CC into the apple -->
    <filter id="emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.6"/>
      <feOffset dx="0" dy="1" result="shadow"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.9"/></feComponentTransfer>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" rx="42" fill="url(#bg)"/>

  <!-- Bold Apple -->
  <path d="M96 52c-37-11-63 16-59 53 5 43 32 59 59 59s54-16 59-59c5-37-22-64-59-53z" fill="url(#apple)"/>

  <!-- Stem -->
  <path d="M91 52c5-16 16-21 27-21" stroke="#4A2812" stroke-width="6.5" stroke-linecap="round" fill="none"/>

  <!-- Leaf -->
  <path d="M107 34c11-3 21 0 27 8-5 5-16 5-27-3" fill="#7FBE45"/>

  <!-- Embossed CC — slightly darker red, with soft top highlight + bottom shadow -->
  <g font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="56" text-anchor="middle">
    <!-- bottom shadow line -->
    <text x="96" y="127" fill="#5A0C0C" opacity=".55">CC</text>
    <!-- top highlight line -->
    <text x="96" y="125" fill="#F47A7A" opacity=".45">CC</text>
    <!-- main pressed-in color -->
    <text x="96" y="126" fill="#8E1818" opacity=".85">CC</text>
  </g>
</svg>
