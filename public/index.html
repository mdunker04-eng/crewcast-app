  <div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; line-height: 1.6; color: #1a1a1a;">
    <h1>CrewCast</h1>
    <p><strong>Employee shift-scheduling app for small businesses.</strong></p>
    <p>CrewCast is a B2B scheduling tool. Employers sign up and add their employees, and employees receive shift schedules, reminders, swap requests, and schedule changes by SMS.</p>
    <h2>SMS Program</h2>
    <p><strong>Program:</strong> CrewCast Notifications.<br>
    <strong>Description:</strong> Shift schedule notifications, reminders, swap requests, and schedule changes for employees of small businesses that use CrewCast.<br>
    <strong>Frequency:</strong> ~1–10 messages per week per employee.<br>
    <strong>Message and data rates may apply.</strong> Reply <strong>STOP</strong> to unsubscribe, <strong>HELP</strong> for help.</p>
    <p><strong>How opt-in works:</strong> Employees do not sign up directly on a public website. The employer signs up for CrewCast, agrees to our Terms (which require them to obtain consent from employees before adding them), and adds employees by entering each employee's phone number. Each employee then receives a one-time setup link by SMS and confirms enrollment by tapping that link and completing account setup.</p>
    <p>Returning employees can request a sign-in link at <a href="/login">/login</a>. The button to request the link is preceded by a visible consent disclosure.</p>
    <p><strong>Links:</strong> <a href="/sms-program">SMS Program details</a> · <a href="/privacy">Privacy Policy</a> · <a href="/terms">Terms &amp; SMS Program Terms</a> · <a href="/login">Sign in</a></p>
    <p>To use the full app, please enable JavaScript.</p>
  </div>
</noscript>
